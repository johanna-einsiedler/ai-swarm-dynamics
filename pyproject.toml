[project]
name = "swarm-sna"
version = "0.1.0"
description = "Social network analysis for multi-agent transcripts, with permutation null models from animal behavior"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "networkx>=3.3",
    "matplotlib>=3.9",
]

[project.scripts]
swarm-sna = "swarm_sna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_sna"]
